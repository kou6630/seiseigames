<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おチンチロ | ゲームルーム</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
      background:
        radial-gradient(circle at top, rgba(255, 215, 120, 0.14), transparent 32%),
        linear-gradient(180deg, #12070a 0%, #1f0d12 45%, #0b0507 100%);
      color: #fff7ef;
      overflow: hidden;
    }

    body {
      position: relative;
    }

    .room-bg-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 170, 90, 0.12), transparent 20%),
        radial-gradient(circle at 80% 30%, rgba(255, 120, 120, 0.10), transparent 24%),
        radial-gradient(circle at 50% 85%, rgba(255, 220, 120, 0.08), transparent 28%);
      filter: blur(10px);
    }

    .room-wrap {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      padding: 18px;
    }

    .room-panel {
      width: 100%;
      height: 100%;
      padding: 20px;
      border-radius: 28px;
      background: rgba(20, 8, 12, 0.78);
      border: 1px solid rgba(255, 230, 200, 0.12);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 16px;
    }

    .room-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .room-sub {
      font-size: 13px;
      letter-spacing: 0.28em;
      color: rgba(255, 235, 215, 0.7);
    }

    .room-title {
      margin: 4px 0 0;
      font-size: clamp(34px, 4vw, 48px);
      line-height: 1;
      letter-spacing: 0.08em;
      color: #ffe0b2;
      text-shadow:
        0 0 18px rgba(255, 185, 110, 0.25),
        0 6px 24px rgba(0, 0, 0, 0.45);
    }

    .room-chip {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 210, 143, 0.12);
      border: 1px solid rgba(255, 210, 143, 0.2);
      color: #ffe0b2;
      font-size: 13px;
      font-weight: 700;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .room-board {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 16px;
    }

    .room-main-card,
    .room-side-card {
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 230, 200, 0.08);
    }

    .room-main-card {
      min-height: 0;
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
    }

    .room-side-card {
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .room-card-head {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .room-card-title {
      font-size: 24px;
      font-weight: 700;
      color: #ffe0b2;
    }

    .room-card-note,
    .room-side-label,
    .room-status {
      font-size: 13px;
      color: rgba(255, 233, 211, 0.7);
    }

    .room-player-list {
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .room-player-item {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 230, 200, 0.08);
    }

    .room-player-avatar,
    .room-player-avatar-empty {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
      flex-shrink: 0;
    }

    .room-player-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .room-player-avatar-empty {
      font-size: 12px;
      color: rgba(255, 233, 211, 0.68);
    }

    .room-player-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .room-player-topline {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .room-player-name {
      font-size: 17px;
      font-weight: 700;
      color: #fff7ef;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .room-player-badge {
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 184, 96, 0.16);
      border: 1px solid rgba(255, 184, 96, 0.26);
      font-size: 11px;
      color: #ffd28f;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .room-player-meta {
      font-size: 13px;
      color: rgba(255, 233, 211, 0.68);
      line-height: 1.5;
    }

    .room-player-right {
      font-size: 13px;
      font-weight: 700;
      color: #fff3e3;
      text-align: right;
      white-space: nowrap;
    }

    .room-side-block {
      border-radius: 18px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 230, 200, 0.08);
    }

    .room-cpu-value {
      margin-top: 8px;
      font-size: 38px;
      font-weight: 900;
      color: #ffd28f;
      line-height: 1;
    }

    .room-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .room-btn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #2c1209;
      background: linear-gradient(180deg, #ffd28f 0%, #ffb860 100%);
      box-shadow:
        0 10px 24px rgba(255, 157, 77, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .room-btn:disabled {
      cursor: default;
      filter: grayscale(0.3) brightness(0.85);
      opacity: 0.7;
    }

    .room-btn-sub {
      background: rgba(255, 255, 255, 0.08);
      color: #fff3e3;
      box-shadow: none;
      border: 1px solid rgba(255, 230, 200, 0.12);
    }

    .room-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 120px;
      border-radius: 16px;
      border: 1px dashed rgba(255, 230, 200, 0.15);
      color: rgba(255, 233, 211, 0.6);
      font-size: 15px;
    }

    @media (max-width: 900px) {
      .room-board {
        grid-template-columns: 1fr;
      }

      .room-side-card {
        justify-content: flex-start;
      }
    }

    @media (max-height: 760px) {
      .room-wrap {
        padding: 12px;
      }

      .room-panel,
      .room-main-card,
      .room-side-card {
        padding: 14px;
      }

      .room-title {
        font-size: 30px;
      }

      .room-btn {
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <div class="room-bg-glow"></div>

  <main class="room-wrap">
    <section class="room-panel">
      <div class="room-head">
        <div>
          <div class="room-sub">OCHINCHIRO BEST BODY</div>
          <h1 class="room-title">待機ルーム</h1>
        </div>
        <div class="room-chip" id="roomWord">-</div>
      </div>

      <div class="room-board">
        <section class="room-main-card">
          <div class="room-card-head">
            <div class="room-card-title">参加プレイヤー</div>
            <div class="room-card-note">ルームマスターが開始できます</div>
          </div>
          <div class="room-player-list" id="roomPlayerList">
            <div class="room-empty">参加者を読み込み中です...</div>
          </div>
        </section>

        <aside class="room-side-card">
          <div class="room-side-block">
            <div class="room-side-label">CPU人数</div>
            <div class="room-cpu-value" id="cpuCountText">0</div>
          </div>

          <div class="room-actions">
            <button type="button" class="room-btn room-btn-sub" id="addCpuBtn">CPU追加</button>
            <button type="button" class="room-btn" id="startGameBtn">開始</button>
            <button type="button" class="room-btn room-btn-sub" id="leaveRoomBtn">戻る</button>
          </div>

          <p class="room-status" id="roomStatusText">待機中です。</p>
        </aside>
      </div>
    </section>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
